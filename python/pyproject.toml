[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmscrap"
version = "0.1.0"
description = "Download Markdown docs from any .md index URL (e.g. llms.txt)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
llmscrap = "llmscrap.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
